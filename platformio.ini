[platformio]
default_envs = t_display_s3

; LilyGo T-Display-S3 (ESP32-S3, 16 MB Flash, 8 MB Octal PSRAM)
; Neues Board? -> eigenes [env:...] anlegen + src/boards/board_<name>.h
[env:t_display_s3]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16mb.csv
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -D BOARD_TDISPLAY_S3
  -D ARDUINO_USB_CDC_ON_BOOT=1
; -I include ist zwingend: PlatformIO reicht das include/-Verzeichnis nur an
; die Projekt-TUs weiter, nicht an libdeps. Ohne dem faellt TFT_eSPI auf
; sein Default-Setup (User_Setup.h, ILI9341/SPI) zurueck, obwohl der Sketch
; tft_setup.h sieht -> Boot-Crash (StoreProhibited in begin_tft_write).
  -I include
; TFT_eSPI 2.5.43 (letzte funktionierende Version fuer T-Display-S3,
; LilyGo-Wiki: > 2.0.14 hat Kompatibilitaetsprobleme, siehe TFT_eSPI#3329).
; Der kritische Fix (USE_HSPI_PORT) ist in include/tft_setup.h gesetzt.
lib_deps =
  bodmer/TFT_eSPI@2.5.43
