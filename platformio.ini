[platformio]
default_envs = t_display_s3

; LilyGo T-Display-S3 (ESP32-S3, 16 MB Flash, 8 MB Octal PSRAM)
; Neues Board? -> eigenes [env:...] anlegen + src/boards/board_<name>.h
[env:t_display_s3]
platform = espressif32@^6.5.0
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = partitions_16mb.csv
; WICHTIG: PlatformIO waehlt sonst bootloader_qio_80m.elf (kein OPI-PSRAM-Support).
; Das Board-File sagt memory_type=qio_opi, aber PlatformIO prueft nur auf
; opi_opi/opi_qspi -> faellt auf flash_mode=qio zurueck -> falscher Bootloader
; -> StoreProhibited-Crash beim PSRAM-Init. build.boot=opi selektiert
; bootloader_opi_80m.elf (korrekt fuer 8MB Octal PSRAM).
board_build.boot = opi
monitor_speed = 115200
extra_scripts = extra_script.py
build_flags =
  -std=gnu++17
  -D BOARD_TDISPLAY_S3
  -D ARDUINO_USB_CDC_ON_BOOT=1
; TFT_eSPI 2.5.43 (letzte funktionierende Version fuer T-Display-S3,
; LilyGo-Wiki: > 2.0.14 hat Kompatibilitaetsprobleme, siehe TFT_eSPI#3329).
; Der kritische Fix (USE_HSPI_PORT) ist in include/tft_setup.h gesetzt.
lib_deps =
  bodmer/TFT_eSPI@2.5.43
