[platformio]
default_envs = t_display_s3

; LilyGo T-Display-S3 (ESP32-S3, 16 MB Flash, 8 MB Octal PSRAM)
; New board? -> create your own [env:...] + src/boards/board_<name>.h
[env:t_display_s3]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16mb.csv
; FAT filesystem on the "storage" partition: `pio run -t uploadfs`
; flashes data/*.vlw (Roboto smooth fonts for the survival game).
board_build.filesystem = fatfs
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -D BOARD_TDISPLAY_S3
  -D ARDUINO_USB_CDC_ON_BOOT=1
; -I include is mandatory: PlatformIO passes the include/ directory only to
; the project TUs, not to libdeps. Without it TFT_eSPI falls back to its
; default setup (User_Setup.h, ILI9341/SPI) even though the sketch sees
; tft_setup.h -> boot crash (StoreProhibited in begin_tft_write).
  -I include
; TFT_eSPI 2.5.43 (last working version for T-Display-S3,
; LilyGo wiki: > 2.0.14 has compatibility problems, see TFT_eSPI#3329).
; The critical fix (USE_HSPI_PORT) is set in include/tft_setup.h.
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@^7.2.0
